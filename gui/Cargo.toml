[package]
name = "gui"
version = "0.1.0"
edition = "2024"

[dependencies]
derive_more = { workspace = true, features = ["from", "debug"] }
iced = { version = "0.14.0", features = ["advanced", "tokio"] }
iced_aw = { version = "0.13.0", default-features = false, features = ["menu"] }
rfd = "0.17.2"
jpk_reader.workspace = true
polars.workspace = true
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
iced_aksel = "0.2.0"
tokio = "1.49.0"


[build-dependencies]
# iced_fontello = "0.14.1"
iced_fontello = { path = "../../iced_fontello" }

[features]
default = ["tracing"]
tracing = ["dep:tracing", "dep:tracing-subscriber", "jpk_reader/tracing"]
